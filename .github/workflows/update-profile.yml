name: Update INSPIRE metrics

on:
  schedule:
    - cron: "17 5 * * *"      # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the at-a-glance card from INSPIRE-HEP
        run: python scripts/update_profile.py

      - name: Commit if the metrics changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/glance-light.svg assets/glance-dark.svg
          if git diff --cached --quiet; then
            echo "No change in metrics."
          else
            git commit -m "Update INSPIRE metrics"
            git push
          fi
